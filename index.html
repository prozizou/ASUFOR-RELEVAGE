<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F59E0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=13.3.0">
    <title>Relevage</title>
</head>
<body>
<div id="app">
    <section id="login-section" class="login-container">
        <div class="logo-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor"><path d="M12 2.5S5.5 9.5 5.5 14a6.5 6.5 0 0 0 13 0C18.5 9.5 12 2.5 12 2.5zm0 15a3.5 3.5 0 0 1-3.5-3.5 1 1 0 0 1 2 0A1.5 1.5 0 0 0 12 15.5a1 1 0 0 1 0 2z"/></svg></div>
        <h1 class="login-title">ASUFOR</h1>
        <p class="login-subtitle">Relevage</p>
        
        <input type="tel" id="agent-phone" class="login-input" placeholder="Numéro de téléphone" inputmode="numeric" maxlength="9" onkeydown="if(event.key==='Enter')login()">
        <input type="number" id="agent-code" class="login-input" placeholder="Code agent" inputmode="numeric" maxlength="6" onkeydown="if(event.key==='Enter')login()">
        <p class="login-hint">Demandez votre numéro et votre code à votre superviseur</p>
        <button onclick="login()" id="login-btn" class="login-btn">ACCÉDER À LA TOURNÉE</button>
        <div id="login-error" class="login-error"></div>
    </section>

    <section id="main-section" class="hidden">
        <header class="header">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                <div id="avatar" class="avatar">A</div>
                <div class="agent-info" style="min-width:0;">
                    <h3 id="agent-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Agent</h3>
                    <p id="agent-zone">Zone</p>
                </div>
            </div>
            <div class="header-right">
                <span id="sync-indicator" class="sync-pending hidden"></span>
                <div class="online-dot" id="online-dot" title="En ligne"></div>
                <div class="counter-badge" id="count-done">0</div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
                <span id="progress-label">0 / 0 relevés</span>
                <span id="progress-pct">0%</span>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)" data-ic="list">Tous</button>
            <button class="filter-tab" data-filter="pending" onclick="setFilter('pending',this)" data-ic="clock">En attente</button>
            <button class="filter-tab" data-filter="done" onclick="setFilter('done',this)" data-ic="check-circle">Relevés</button>
            <button class="filter-tab" data-filter="anomaly" onclick="setFilter('anomaly',this)" data-ic="alert-triangle">Anomalies</button>
        </div>

        <div class="search-container">
            <input type="text" id="search" placeholder="Rechercher client, compteur..." oninput="applyFilters()">
        </div>

        <div id="list"></div>

        <div class="footer">
            <button class="btn-report" onclick="showReport()" data-ic="list">RAPPORT</button>
            <button class="btn-logout" onclick="confirmLogout()" title="Se déconnecter">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </section>
</div>

<div id="camera-modal" class="hidden">
    <div id="camera-live-view">
        <video id="camera-video" autoplay playsinline></video>
        <div class="camera-blur-overlay"></div>
        <div class="camera-ui">
            <div class="meter-frame"></div>
            <div class="camera-instruction">Centrez le compteur d'eau ici</div>
        </div>
        <div class="camera-controls">
            <button class="btn-cam-close" onclick="stopCamera()" data-ic="close">Annuler</button>
            <button class="btn-cam-capture" onclick="captureImage()"></button>
            <div style="width: 80px;"></div>
        </div>
    </div>

    <div id="camera-preview-view" class="hidden">
        <img id="preview-img" src="" alt="Photo prise">
        <div class="preview-controls">
            <div class="ocr-box">
                <label>Chiffre lu automatiquement (vous pouvez le corriger) :</label>
                <input type="number" id="ocr-input" class="login-input" style="width: 100%; margin: 8px 0; border-radius: 12px; padding: 12px; background: rgba(255,255,255,0.1); color: white;" step="0.1">
                <small id="ocr-status" style="color: var(--accent); display: block; min-height: 20px;">Lecture du chiffre en cours...</small>
            </div>
            <div style="display: flex; gap: 10px; width: 100%; margin-top: 15px;">
                <button class="btn-modal secondary" onclick="retakePhoto()" style="background: rgba(255,255,255,0.2); color: white; border: none;" data-ic="refresh">Reprendre</button>
                <button class="btn-modal primary" onclick="confirmPhotoAndIndex()" id="btn-confirm-photo" data-ic="check">Valider l'index</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<div id="modal-container"></div>

<!-- ✅ Firebase SDK compat (ordre important : app → auth → database) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<!-- ✅ Point d'entrée corrigé : JS/main.js -->
<script type="module" src="JS/main.js?v=13.3.0"></script>

</body>
</html>
